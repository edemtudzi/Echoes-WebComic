<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic web-comic library showcase</title>
  <desc id="desc">Layered comic panels, a glowing source motif, and a stylized cowrie-inspired portal in black, white, and yellow.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.58" stop-color="#f4f0df"/>
      <stop offset="1" stop-color="#d8d2bf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe36a"/>
      <stop offset="0.46" stop-color="#ffd21a"/>
      <stop offset="1" stop-color="#d99b00"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#fff9c7" stop-opacity="0.94"/>
      <stop offset="0.35" stop-color="#ffd21a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd21a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#090909" opacity="0.18"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="warmGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.82 0 0 0.67  0 0 0.22 0 0  0 0 0 0.72 0" result="goldBlur"/>
      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1200" rx="52" fill="url(#paper)"/>
  <path d="M0 0h900v318L0 662Z" fill="url(#gold)"/>
  <rect width="900" height="1200" fill="url(#dots)" opacity="0.42"/>
  <path d="M-20 990C164 906 238 792 324 600c78-174 200-304 395-354 84-22 149-58 210-116" fill="none" stroke="#090909" stroke-width="9" opacity="0.09"/>
  <path d="M-12 792c148-26 262-84 338-174 94-112 126-246 282-318 88-40 193-42 306-12" fill="none" stroke="#fffef8" stroke-width="18" opacity="0.38"/>

  <g filter="url(#softShadow)">
    <rect x="102" y="166" width="650" height="820" rx="42" fill="#fffef8" opacity="0.88"/>
    <rect x="134" y="202" width="588" height="748" rx="32" fill="#f0ebdc" stroke="#090909" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <g transform="rotate(-6 450 570)" filter="url(#softShadow)">
    <rect x="204" y="266" width="420" height="586" rx="32" fill="#111"/>
    <path d="M204 266h420v232L204 678Z" fill="url(#gold)"/>
    <path d="M232 720c78-56 156-72 238-48 56 17 98 13 126-12v192H232Z" fill="#fffef8" opacity="0.92"/>
    <path d="M260 332h138M260 372h206M260 412h96" stroke="#090909" stroke-width="14" stroke-linecap="round" opacity="0.72"/>
  </g>

  <g transform="rotate(7 534 574)" filter="url(#softShadow)">
    <rect x="326" y="324" width="410" height="560" rx="34" fill="#fffef8"/>
    <path d="M326 324h410v220L326 716Z" fill="#090909"/>
    <path d="M360 374c88 76 190 96 306 60" fill="none" stroke="#ffd21a" stroke-width="16" stroke-linecap="round" opacity="0.88"/>
    <path d="M360 790h238M360 830h170" stroke="#090909" stroke-width="18" stroke-linecap="round" opacity="0.78"/>
  </g>

  <circle cx="490" cy="560" r="300" fill="url(#glow)" filter="url(#warmGlow)"/>

  <g filter="url(#softShadow)">
    <ellipse cx="476" cy="578" rx="154" ry="216" fill="url(#gold)"/>
    <ellipse cx="476" cy="578" rx="116" ry="174" fill="#f7d87c" opacity="0.68"/>
    <path d="M446 378c-77 62-118 138-118 219s42 156 118 219c42-84 63-157 63-219s-21-135-63-219Z" fill="#fff3c0"/>
    <path d="M512 378c78 62 119 138 119 219s-41 156-119 219c-42-84-63-157-63-219s21-135 63-219Z" fill="#d58b00"/>
    <path d="M480 410c39 60 58 123 58 188s-19 128-58 188c-39-60-58-123-58-188s19-128 58-188Z" fill="#090909"/>
    <path d="M408 498c26 18 51 28 75 28 26 0 52-10 78-28M396 572c34 24 64 36 90 36 28 0 59-12 94-36M404 648c28 20 56 30 83 30 29 0 58-10 88-30" fill="none" stroke="#7a3f00" stroke-width="9" stroke-linecap="round" opacity="0.78"/>
    <path d="M484 456v42M484 696v42M360 598h42M558 598h42" stroke="#fff1a6" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g opacity="0.92">
    <rect x="92" y="1024" width="716" height="86" rx="43" fill="#090909" opacity="0.78"/>
    <circle cx="156" cy="1067" r="21" fill="#ffd21a"/>
    <rect x="198" y="1046" width="210" height="18" rx="9" fill="#fffef8" opacity="0.92"/>
    <rect x="198" y="1076" width="350" height="12" rx="6" fill="#fffef8" opacity="0.58"/>
  </g>
</svg>
